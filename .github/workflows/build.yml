name: build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify committed dist/ matches sources
        run: |
          if ! git diff --quiet -- dist; then
            echo "::error::server/dist is out of date. Run 'npm run build' in server/ and commit the result."
            git diff --stat -- dist
            exit 1
          fi
